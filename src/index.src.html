<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141110">
<title>ريلز المفروشات</title>
<style>
/*FONTS*/
:root{
  --ink:#1C1916; --muted:#6B635A; --ground:#FAF7F2; --card:#FFFFFF; --line:#E7E0D6;
  --chip:#F0E8DC; --accent:#A35A12; --price:#8A4E10; --wa:#0F7A43; --dark:#141110; --gold:#E2B864;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a2522;overscroll-behavior:none}
body{font-family:'Plex Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:active{opacity:.75}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;background:var(--ground)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:84px;-webkit-overflow-scrolling:touch;animation:fade .18s}
.screen.noNav{padding-bottom:0}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.h1{margin:0;font-size:24px;font-weight:700}
.h2{margin:0;font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:44px;display:flex;align-items:center}
.chip span{display:flex;align-items:center;gap:4px;height:34px;padding:0 14px;border-radius:17px;background:#fff;border:1px solid #DDD5CA;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on span{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.chip.accent.on span{background:var(--accent);border-color:var(--accent)}
.chip.dark span{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.3);color:#fff}
.chip.dark.on span{background:#fff;color:var(--dark);border-color:#fff}
.iconBtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconBtn.light{background:rgba(255,255,255,.92)}
.iconBtn.outline{background:#fff;border:1px solid var(--line)}
.btn{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}
.btn.wa{background:var(--wa);color:#fff}
.btn.accent{background:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid #D9D0C3;font-weight:600}
.btn.danger{background:#fff;border:1.5px solid #E5B8B0;color:#A12A1B;font-weight:600}
.card{background:var(--card);border:1px solid #EEE7DC;border-radius:16px}
.badge{height:20px;padding:0 6px;border-radius:6px;background:#E4F1E8;color:#0B5E33;font-weight:700;font-size:11px;display:inline-flex;align-items:center}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
nav.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:#fff;border-top:1px solid var(--line);z-index:20}
nav.tabbar.dark{background:#0E0C0B;border-top-color:#0E0C0B}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabbar.dark button{color:#A8A29A}
nav.tabbar button.on{color:var(--ink);font-weight:700}
nav.tabbar.dark button.on{color:#fff}
/* reels */
.reels{position:absolute;inset:0;bottom:72px;overflow-y:scroll;scroll-snap-type:y mandatory;background:var(--dark);scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff;background:#000}
.reel .art{position:absolute;inset:0;width:100%;height:100%}
.reel .scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.9) 100%);pointer-events:none}
.reel.playing .kb{animation:kb 14s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1) translateY(-10px)}}
.reelTop{position:absolute;top:0;left:0;right:0;padding:10px 12px 0;z-index:5;color:#fff}
.side{position:absolute;left:8px;bottom:128px;width:64px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:4}
.side button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:#fff;min-height:44px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.caption{position:absolute;right:16px;left:82px;bottom:98px;z-index:4;display:flex;flex-direction:column;gap:8px}
.productBar{position:absolute;right:12px;left:12px;bottom:14px;z-index:4;display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:rgba(20,17,16,.8);border:1px solid rgba(255,255,255,.16)}
.progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22);z-index:4}
.progress i{position:absolute;top:0;right:0;height:3px;background:#fff;width:0}
.reel.playing.still .progress i{animation:prog 12s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.heartPop{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;z-index:6}
.heartPop.go{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.pauseIcon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:36px;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none}
.reel.paused .pauseIcon{display:flex}
/* gallery */
.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.gallery::-webkit-scrollbar{display:none}
.gallery>*{flex:0 0 100%;height:100%;scroll-snap-align:center;position:relative;overflow:hidden}
.dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:all .2s}
.dots i.on{width:18px;background:#fff}
/* sheet */
.overlay{position:absolute;inset:0;background:rgba(10,8,7,.55);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px 22px;display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out;max-height:92%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;max-width:90%;text-align:center;animation:fade .2s}
.bubble{background:#E3F6DE;border-radius:14px 14px 4px 14px;padding:12px 14px;font-size:14px;line-height:1.7;white-space:pre-line}
.field{height:48px;border-radius:12px;border:1px solid #D9D0C3;padding:0 14px;font-size:15px;background:#fff;width:100%}
textarea.field{height:auto;min-height:84px;padding:12px 14px;line-height:1.6;resize:vertical}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.label{font-size:14px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.uploadBox{border:1.5px dashed #CFC5B6;border-radius:14px;background:#fff;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);position:relative;padding:12px;text-align:center}
.uploadBox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.thumbRow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:2px}
.thumbRow .t{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#eee}
.thumbRow .t button{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.toggle{width:52px;height:30px;border-radius:15px;background:#D9D0C3;position:relative;flex-shrink:0;transition:background .2s}
.toggle::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--wa)}
.toggle.on::after{transform:translateX(-22px)}
.mineTag{height:22px;padding:0 8px;border-radius:11px;background:var(--gold);color:#141110;font-size:11px;font-weight:700;display:inline-flex;align-items:center}
/* onboarding */
.onb{position:absolute;inset:0;background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:48px 24px 28px;gap:20px;z-index:80;animation:fade .3s}
.onb .cityBtn{height:56px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;font-weight:600;color:#fff}
.onb .cityBtn.on{background:var(--gold);color:#141110;border-color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   ريلز المفروشات — نموذج تجريبي قابل للاستخدام
   - Demo listings are illustrations; products added in "merchant mode"
     use real photos/videos from the phone and are stored on the device.
   ===================================================================== */
const IS_ANDROID = !!(window.Android && window.Android.openUrl);
const DEFAULT_PHONE = '22226159444';
const CITIES = ['كل المدن','نواكشوط','نواذيبو','كيفة','روصو','أطار'];
const CATS = [['all','الكل'],['bed','غرف نوم'],['sofa','صالونات'],['vanity','تسريحات'],['wardrobe','دواليب'],['decor','ديكور وأخرى']];

const SHOPS = [
  {id:'diyar', name:'ديار للمفروشات', letter:'د', bg:'#1F2A44', fg:'#E2B864', city:'نواكشوط', area:'كارفور توري، السادسة', tags:'غرف نوم · صالونات · ديكور', followers:'22 ألف', verified:true, inst:true, phone:'22226159444'},
  {id:'anaqa', name:'بيت الأناقة', letter:'ب', bg:'#2F4A48', fg:'#fff', city:'نواكشوط', area:'تفرغ زينة', tags:'صالونات · ستائر', followers:'6.2 ألف', verified:true, inst:false},
  {id:'nour', name:'مفروشات النور', letter:'ن', bg:'#6B4E3D', fg:'#fff', city:'نواكشوط', area:'لكصر', tags:'غرف نوم · دواليب', followers:'9.7 ألف', verified:false, inst:true},
  {id:'reem', name:'صالونات الريم', letter:'ر', bg:'#4A3B5C', fg:'#fff', city:'نواكشوط', area:'عرفات', tags:'صالونات مغربية وأوروبية', followers:'3.1 ألف', verified:false, inst:true},
  {id:'shatee', name:'معرض الشاطئ للأثاث', letter:'ش', bg:'#2B4A6B', fg:'#fff', city:'نواذيبو', area:'', tags:'غرف نوم · مكاتب', followers:'2.4 ألف', verified:true, inst:false},
  {id:'rahma', name:'مفروشات الرحمة', letter:'ح', bg:'#5A4234', fg:'#fff', city:'نواذيبو', area:'', tags:'صالونات · سجاد', followers:'1.8 ألف', verified:false, inst:true},
  {id:'wafa', name:'أثاث الوفاء', letter:'و', bg:'#3E5A3A', fg:'#fff', city:'كيفة', area:'', tags:'غرف نوم · تسريحات', followers:'1.1 ألف', verified:false, inst:true},
  {id:'arous', name:'بيت العروس', letter:'ع', bg:'#7A3E4A', fg:'#fff', city:'روصو', area:'', tags:'أطقم العرائس', followers:'2.9 ألف', verified:true, inst:false}
];

const DEMO_PRODUCTS = [
  {id:'p1', name:'طقم غرفة النوم «إسطنبول»', shop:'diyar', kind:'bed', price:295000, reel:true, inst:true, wall:'#3B3029', tone:'#8B5A3C', tone2:'#6B4E3D',
   colors:[['بني جوزي','#6B4E3D'],['رمادي دافئ','#8C857C'],['كريمي','#D9CDBB']], parts:['سرير 180×200 سم','دولاب 6 أبواب','تسريحة مع مرآة','كومودينو × 2'],
   caption:'طقم غرفة نوم تركي كامل: سرير، دولاب، تسريحة وكومودينو. التوصيل والتركيب داخل نواكشوط.', likes:2418, views:'24.1K', t:1},
  {id:'p2', name:'صالون أوروبي 7 مقاعد', shop:'anaqa', kind:'sofa', price:180000, reel:true, inst:false, wall:'#5B4A3C', tone:'#C9B79C', tone2:'#B09D80',
   colors:[['بيج','#C9B79C'],['أزرق ملكي','#2B3A5C'],['رمادي','#8C857C']], parts:['كنبة 3 مقاعد','كنبة مقعدين','كرسيان منفردان','طاولة وسط'],
   caption:'صالون أوروبي بقماش مقاوم للبقع، مناسب لصالة الضيوف.', likes:1290, views:'12.8K', t:2},
  {id:'p3', name:'تسريحة بمرآة دائرية', shop:'nour', kind:'vanity', price:52000, reel:true, inst:true, wall:'#4A3E35', tone:'#EDE6DA', tone2:'#D9CDBB',
   colors:[['أبيض عاجي','#EDE6DA'],['بني','#6B4E3D']], parts:['تسريحة بدرجين','مرآة دائرية','كرسي مبطّن'],
   caption:'تسريحة أرضية بمرآة دائرية وإطار ذهبي. الأكثر طلباً هذا الشهر.', likes:3150, views:'31.5K', t:3},
  {id:'p4', name:'دولاب 6 أبواب', shop:'nour', kind:'wardrobe', price:120000, reel:false, inst:true, wall:'#4B4038', tone:'#D9CDBB', tone2:'#8A6A3E',
   colors:[['كريمي','#D9CDBB'],['رمادي','#8C857C']], parts:['6 أبواب','رفوف داخلية','قضيب تعليق'], caption:'دولاب واسع بستة أبواب ورفوف داخلية.', likes:410, views:'4.1K', t:4},
  {id:'p5', name:'صالون مغربي كامل', shop:'reem', kind:'sofa', price:150000, reel:true, inst:true, wall:'#2F3A3A', tone:'#2B3A5C', tone2:'#22304D',
   colors:[['أزرق','#2B3A5C'],['عنابي','#6E2A35']], parts:['جلسة على شكل U','وسائد ظهر','طاولة نحاسية'],
   caption:'صالون مغربي تفصيل حسب مقاس غرفتك. القماش والتطريز من اختيارك.', likes:920, views:'9.2K', t:5},
  {id:'p6', name:'طقم غرفة نوم رمادي', shop:'shatee', kind:'bed', price:310000, reel:true, inst:false, wall:'#4B4038', tone:'#A7A099', tone2:'#8C857C',
   colors:[['رمادي','#8C857C'],['أبيض','#E9E4DC']], parts:['سرير 180×200 سم','دولاب 4 أبواب','تسريحة','كومودينو × 2'],
   caption:'طقم عصري بلون رمادي هادئ. التوصيل داخل نواذيبو.', likes:1500, views:'15.0K', t:6},
  {id:'p7', name:'تسريحة كلاسيك', shop:'wafa', kind:'vanity', price:48000, reel:false, inst:true, wall:'#3B3029', tone:'#6B4E3D', tone2:'#5A4234',
   colors:[['بني','#6B4E3D']], parts:['تسريحة','مرآة','كرسي'], caption:'تسريحة كلاسيكية بخشب بني.', likes:120, views:'1.2K', t:7},
  {id:'p8', name:'دولاب بأبواب منزلقة', shop:'arous', kind:'wardrobe', price:135000, reel:true, inst:false, wall:'#3E3530', tone:'#8C857C', tone2:'#E2B864',
   colors:[['رمادي','#8C857C'],['خشبي','#8A6A3E']], parts:['بابان منزلقان','مرآة كاملة','أدراج داخلية'],
   caption:'دولاب بأبواب منزلقة ومرآة كاملة، يوفّر المساحة في الغرف الصغيرة.', likes:640, views:'6.4K', t:8}
];

/* ============ Persistence ============ */
const LS_KEY='reelsdemo.v2';
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||{}; }catch(_){ return {}; } }
function savePrefs(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({city:S.city, liked:S.liked, saved:S.saved, followed:S.followed, onboarded:S.onboarded, demoPhone:S.demoPhone, myShopName:S.myShopName})); }catch(_){}
}
const DB = {
  db:null,
  open(){ return new Promise(res=>{ try{
    const r=indexedDB.open('reelsdemo',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('products',{keyPath:'id'});
    r.onsuccess=()=>{this.db=r.result;res(true)}; r.onerror=()=>res(false);
  }catch(_){res(false)} }); },
  all(){ return new Promise(res=>{ if(!this.db) return res([]); const t=this.db.transaction('products').objectStore('products').getAll(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]); }); },
  put(o){ return new Promise((res,rej)=>{ if(!this.db) return rej(new Error('no db')); const tx=this.db.transaction('products','readwrite'); tx.objectStore('products').put(o); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
  del(id){ return new Promise(res=>{ if(!this.db) return res(); const tx=this.db.transaction('products','readwrite'); tx.objectStore('products').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); },
  clear(){ return new Promise(res=>{ if(!this.db) return res(); const tx=this.db.transaction('products','readwrite'); tx.objectStore('products').clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
};

/* ============ State ============ */
const P = loadPrefs();
const S = {
  stack:[{name:'reels'}],
  city: P.city || 'نواكشوط',
  liked: P.liked||{}, saved: P.saved||{}, followed: P.followed||{},
  onboarded: !!P.onboarded,
  demoPhone: P.demoPhone || DEFAULT_PHONE,
  myShopName: P.myShopName || '',
  reelFeed:'for', reelCat:'all', muted:true,
  storesInst:false, catalogCat:'all', catalogSort:0, cityMenu:false, q:'',
  browseFilters:{}, color:{}, qty:1, district:'', sheet:null, shopTab:0,
  mine:[], draft:null
};
let PRODUCTS = DEMO_PRODUCTS.slice();

function hydrateMine(rows){
  S.mine.forEach(p=>{ (p.photoUrls||[]).forEach(u=>URL.revokeObjectURL(u)); if(p.videoUrl) URL.revokeObjectURL(p.videoUrl); });
  S.mine = rows.sort((a,b)=>b.t-a.t).map(r=>({
    ...r, mine:true, reel:true,
    photoUrls:(r.photos||[]).map(b=>URL.createObjectURL(b)),
    videoUrl:r.video?URL.createObjectURL(r.video):null,
    colors:(r.colors&&r.colors.length?r.colors:['حسب الطلب']).map(c=>[c,null]),
    likes:0, views:'جديد'
  }));
  PRODUCTS = S.mine.concat(DEMO_PRODUCTS);
}

/* ============ Helpers ============ */
const $app=document.getElementById('app');
const shopById=id=>SHOPS.find(s=>s.id===id)||SHOPS[0];
const prodById=id=>PRODUCTS.find(p=>p.id===id);
const fmt=n=>Number(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>S.stack[S.stack.length-1];
const inCity=city=>S.city==='كل المدن'||city===S.city;
const shopName=s=>(s.id==='diyar'&&S.myShopName)?S.myShopName:s.name;
const phoneOf=s=>(s.phone||S.demoPhone||DEFAULT_PHONE).replace(/\D/g,'');
const hasMedia=p=>!!(p.videoUrl||(p.photoUrls&&p.photoUrls.length));

const I={

/* Visual for a product in a small box: real photo if present, else illustration */
function cover(p,vb='0 230 390 540',color=null){
  if(p.photoUrls&&p.photoUrls.length) return `<img class="media" src="${p.photoUrls[0]}" alt="" loading="lazy">`;
  if(p.videoUrl) return `<video class="media" src="${p.videoUrl}#t=0.5" muted playsinline preload="metadata"></video>`;
  return roomArt(p,color,{vb});
}
function thumb(p,h=150){ return `<span style="position:relative;display:block;height:${h}px;overflow:hidden;background:${p.wall||'#3B3029'}">${cover(p)}</span>`; }
function avatar(s,size=52,border=''){ const n=shopName(s); return `<span class="avatar" style="width:${size}px;height:${size}px;background:${s.bg};color:${s.fg};font-size:${Math.round(size*.42)}px;${border}">${esc(n.trim()[0]||s.letter)}</span>`; }
function chipsHTML(items,activeId,action,variant=''){
  return `<div class="chips">${items.map(([id,label])=>`<button class="chip ${variant} ${id===activeId?'on':''}" data-act="${action}" data-v="${esc(id)}" aria-pressed="${id===activeId}"><span>${esc(label)}</span></button>`).join('')}</div>`;
}

/* ============ Real-world actions ============ */
function openExternal(url){
  if(IS_ANDROID){ window.Android.openUrl(url); return; }
  window.open(url,'_blank');
}
function waMessage(p,qty,colorName,district){
  let m=`السلام عليكم، رأيت هذا المنتج على تطبيق ريلز المفروشات وأريد طلبه:\n${p.name}\nاللون: ${colorName} — الكمية: ${qty}\nالسعر المعروض: ${fmt(p.price*qty)} أوقية`;
  if(district&&district.trim()) m+=`\nالحي: ${district.trim()}`;
  return m;
}
function openWhatsApp(phone,text){ openExternal(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`); }
function callPhone(phone){ openExternal(`tel:+${phone}`); }
async function shareText(text){
  if(IS_ANDROID && window.Android.share){ window.Android.share(text); return; }
  if(navigator.share){ try{ await navigator.share({text}); return; }catch(_){ return; } }
  try{ await navigator.clipboard.writeText(text); toast('تم نسخ النص للمشاركة'); }catch(_){ toast('المشاركة غير متاحة هنا'); }
}

/* ============ Navigation ============ */
function go(name,params={}){ pauseAll(); S.stack.push({name,...params}); history.pushState({d:S.stack.length},''); S.cityMenu=false; render(true); }
function tab(name){ pauseAll(); S.stack=[{name}]; history.replaceState({d:1},''); S.cityMenu=false; render(true); }
window.addEventListener('popstate',()=>{
  if(S.sheet){ S.sheet=null; render(); return; }
  if(S.cityMenu){ S.cityMenu=false; render(); return; }
  if(S.stack.length>1){ pauseAll(); S.stack.pop(); render(true); }
});
let toastTimer;
function toast(msg){
  clearTimeout(toastTimer); document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $app.appendChild(t);
  toastTimer=setTimeout(()=>t.remove(),2200);
}
function tabbar(active,dark=false){
  const items=[['reels','الرئيسية','home'],['browse','تصفّح','browse'],['stores','المتاجر','stores'],['saved','المحفوظات','saved'],['me','حسابي','me']];
  return `<nav class="tabbar ${dark?'dark':''}" aria-label="التنقل الرئيسي">${items.map(([n,l,ic])=>`<button data-act="tab" data-v="${n}" class="${n===active?'on':''}" ${n===active?'aria-current="page"':''}>${NAV_ICONS[ic]}<span>${l}</span></button>`).join('')}</nav>`;
}
function header(title,extra=''){

}

  let list=PRODUCTS.filter(p=>p.reel&&inCity(shopById(p.shop).city));

  if(S.reelFeed==='following') list=list.filter(p=>S.followed[p.shop]);
  return list;
}

  if(p.photoUrls&&p.photoUrls.length) return `<div class="kb" style="position:absolute;inset:0"><img class="media" src="${p.photoUrls[0]}" alt=""></div>`;

async function publishDraft(){
  const d=S.draft;
  const price=parseInt(String(d.price).replace(/[^\d]/g,''),10);
  if(!d.name.trim()){ toast('اكتب اسم المنتج'); document.getElementById('f_name')?.focus(); return; }
  if(!price){ toast('اكتب السعر بالأوقية'); document.getElementById('f_price')?.focus(); return; }
  if(!d.photos.length && !d.video){ toast('أضف صورة أو فيديو واحداً على الأقل'); return; }
  const split=s=>s.split(/[،,]/).map(x=>x.trim()).filter(Boolean);
  const rec={id:'m'+Date.now(), shop:'diyar', name:d.name.trim(), price, kind:d.kind, caption:d.caption.trim(),
    colors:split(d.colors), parts:split(d.parts), inst:d.inst, photos:d.photos.slice(0,8), video:d.video||null,
    wall:'#3B3029', tone:'#8B5A3C', tone2:'#6B4E3D', t:Date.now()};
  const btn=document.querySelector('[data-act="publish"]'); if(btn){ btn.textContent='جارٍ الحفظ…'; btn.disabled=true; }
  try{ await DB.put(rec); }
  catch(e){ toast('تعذّر الحفظ على الهاتف. جرّب فيديو أصغر.'); if(btn){btn.textContent='نشر المنتج';btn.disabled=false;} return; }
  if(d._urls) d._urls.forEach(u=>URL.revokeObjectURL(u));
  S.draft=null;
  hydrateMine(await DB.all());
  S.stack.pop(); history.replaceState({d:S.stack.length},'');
  if(S.city!=='كل المدن' && S.city!=='نواكشوط') S.city='نواكشوط';
  savePrefs(); render(true); toast('تم النشر. منتجك الآن في الريلز والكتالوج');
}

/* ============ Render ============ */
let reelObserver;
function render(resetScroll){
  if(!S.onboarded){ $app.innerHTML=onboardingHTML(); return; }
  const c=cur();
  const prevScroll=!resetScroll&&document.querySelector('.screen')?document.querySelector('.screen').scrollTop:0;
  const prevReel=!resetScroll&&document.getElementById('reels')?document.getElementById('reels').scrollTop:0;
  let html='';
  switch(c.name){
    case 'reels': html=reelsScreen(); break;
    case 'product': html=productScreen(c.id); break;
    case 'shop': html=shopScreen(c.id); break;
    case 'browse': html=browseScreen(); break;
    case 'stores': html=storesScreen(); break;
    case 'catalog': html=catalogScreen(); break;
    case 'saved': html=savedScreen(); break;
    case 'me': html=meScreen(); break;
    case 'merchant': html=merchantScreen(); break;
    case 'addProduct': html=addProductScreen(); break;
  }
  if(S.sheet) html+=orderSheet(S.sheet);
  $app.innerHTML=html;
  const sc=document.querySelector('.screen'); if(sc) sc.scrollTop=prevScroll;
  const rl=document.getElementById('reels');
  if(rl){ rl.scrollTop=(c.startAt!=null&&resetScroll)?c.startAt*rl.clientHeight:prevReel; setupReels(rl); }
  bindInputs();
}
function bindInputs(){
  const d=document.getElementById('district');
  if(d) d.addEventListener('input',e=>{S.district=e.target.value; const p=prodById(S.sheet); document.getElementById('bubble').textContent=waMessage(p,S.qty,p.colors[S.color[S.sheet]||0][0],S.district);});
  const q=document.getElementById('q');
  if(q) q.addEventListener('input',e=>{S.q=e.target.value; document.getElementById('catalogGrid').innerHTML=catalogGridHTML();});
  const ph=document.getElementById('demoPhone');
  if(ph) ph.addEventListener('change',e=>{const v=e.target.value.replace(/\D/g,''); if(v.length>=8){S.demoPhone=v; savePrefs(); toast('تم حفظ الرقم');} else toast('رقم غير صالح');});
  const sn=document.getElementById('shopNameIn');
  if(sn) sn.addEventListener('change',e=>{S.myShopName=e.target.value.trim(); savePrefs(); toast('تم حفظ اسم المتجر');});
  document.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('input',e=>{S.draft[el.dataset.f]=e.target.value;}));
  const pi=document.getElementById('photoIn');
  if(pi) pi.addEventListener('change',e=>{ const fs=[...e.target.files].filter(f=>f.type.startsWith('image/')); S.draft.photos=S.draft.photos.concat(fs).slice(0,8); render(); });
  const vi=document.getElementById('videoIn');
  if(vi) vi.addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; if(f.size>150*1024*1024){ toast('الفيديو كبير جداً (أكثر من 150MB)'); return; } S.draft.video=f; render(); });
  const g=document.getElementById('gallery');
  if(g){ const dots=document.querySelectorAll('#dots i'); g.addEventListener('scroll',()=>{ const i=Math.round(Math.abs(g.scrollLeft)/g.clientWidth); dots.forEach((dd,k)=>dd.classList.toggle('on',k===i)); },{passive:true}); }
}
function pauseAll(){ document.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(_){}}); }
function setupReels(rl){
  if(reelObserver) reelObserver.disconnect();
  reelObserver=new IntersectionObserver(es=>es.forEach(e=>{
    const on=e.isIntersecting&&e.intersectionRatio>.6, r=e.target, v=r.querySelector('video.rv');
    r.classList.toggle('playing',on);
    if(v){ if(on&&!r.classList.contains('paused')){ v.muted=S.muted; v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); }); } else v.pause(); }
  }),{root:rl,threshold:[.6]});
  rl.querySelectorAll('.reel').forEach(r=>{
    reelObserver.observe(r);
    let last=0,timer;
    r.addEventListener('click',e=>{
      if(e.target.closest('button')) return;
      const now=Date.now(), id=r.dataset.reel;
      if(now-last<300){ clearTimeout(timer); last=0;
        if(!S.liked[id]){S.liked[id]=true; savePrefs(); updateLike(r,id);}
        const h=r.querySelector('.heartPop'); h.classList.remove('go'); void h.offsetWidth; h.classList.add('go'); return; }
      last=now;
      timer=setTimeout(()=>{ const v=r.querySelector('video.rv'); if(!v) return; if(v.paused){ r.classList.remove('paused'); v.play().catch(()=>{}); } else { r.classList.add('paused'); v.pause(); } },300);
    });
  });
}
function updateLike(r,id){ const b=r.querySelector('[data-act="like"]'), p=prodById(id); b.innerHTML=I.heart(!!S.liked[id])+`<span>${fmt(p.likes+(S.liked[id]?1:0))}</span>`; b.setAttribute('aria-pressed',!!S.liked[id]); }
function inReels(el){ return !!el.closest('.reel'); }

/* ============ Events ============ */
$app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  if(act==='closeSheet'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="closeSheet"]')) return;
  switch(act){
    case 'onbCity': S.city=v; render(); break;
    case 'onbDone': S.onboarded=true; savePrefs(); render(true); break;
    case 'tab': tab(v); break;
    case 'go': if(v==='catalog'){S.catalogCat='all';} go(v); break;
    case 'back': history.back(); break;
    case 'product': go('product',{id:v}); break;
    case 'shop': S.shopTab=0; go('shop',{id:v}); break;
    case 'watch': {
      S.reelCat='all'; S.reelFeed='for';
      let list=reelList(), idx=list.findIndex(p=>p.id===v);
      if(idx<0){ S.city='كل المدن'; list=reelList(); idx=list.findIndex(p=>p.id===v); }
      go('reels',{startAt:Math.max(0,idx)}); break;
    }
    case 'order': S.qty=1; S.sheet=v; history.pushState({sheet:1},''); render(); break;
    case 'closeSheet': history.back(); break;
    case 'qty': S.qty=Math.min(20,Math.max(1,S.qty+(+v))); render(); break;
    case 'sendWA': { const p=prodById(v), s=shopById(p.shop); openWhatsApp(phoneOf(s), waMessage(p,S.qty,p.colors[S.color[v]||0][0],S.district)); break; }
    case 'waShop': { const s=shopById(v); openWhatsApp(phoneOf(s), `السلام عليكم، وجدت ${shopName(s)} على تطبيق ريلز المفروشات وأريد الاستفسار.`); break; }
    case 'call': callPhone(phoneOf(shopById(v))); break;
    case 'share': { const p=prodById(v), s=shopById(p.shop); shareText(`${p.name}\n${fmt(p.price)} أوقية — ${shopName(s)}، ${s.city}\nشاهده على تطبيق ريلز المفروشات`); break; }
    case 'like': { S.liked[v]=!S.liked[v]; savePrefs(); const r=el.closest('.reel'); if(r) updateLike(r,v); else render(); break; }
    case 'save': {
      S.saved[v]=!S.saved[v]; savePrefs(); toast(S.saved[v]?'تم الحفظ في المحفوظات':'أُزيل من المحفوظات');
      if(inReels(el)){ el.innerHTML=I.save(!!S.saved[v])+'<span>حفظ</span>'; el.setAttribute('aria-pressed',!!S.saved[v]); } else render(); break; }
    case 'follow': {
      S.followed[v]=!S.followed[v]; savePrefs(); toast(S.followed[v]?'تتابع هذا المتجر الآن':'ألغيت المتابعة');
      if(inReels(el)){ document.querySelectorAll(`.reel [data-act="follow"][data-v="${v}"]`).forEach(b=>{ const f=!!S.followed[v]; b.style.background=f?'#fff':'#E2B864'; b.innerHTML=f?I.check('#141110',14):I.plus(); b.setAttribute('aria-label',f?'إلغاء المتابعة':'متابعة المتجر'); }); }
      else render(); break; }
    case 'mute': S.muted=!S.muted; document.querySelectorAll('video.rv').forEach(x=>x.muted=S.muted); document.querySelectorAll('[data-act="mute"]').forEach(b=>{b.innerHTML=I.sound(!S.muted); b.setAttribute('aria-label',S.muted?'تشغيل الصوت':'كتم الصوت');}); break;
    case 'feed': S.reelFeed=v; render(true); break;
    case 'reelCat': S.reelCat=v; render(true); break;
    case 'color': { const [id,i]=v.split('|'); S.color[id]=+i; render(); break; }
    case 'shopTab': S.shopTab=+v; render(); break;
    case 'cityMenu': S.cityMenu=!S.cityMenu; render(); break;
    case 'closeMenu': S.cityMenu=false; render(); break;
    case 'setCity': S.city=v; S.cityMenu=false; savePrefs(); render(cur().name==='reels'); break;
    case 'storesInst': S.storesInst=!S.storesInst; render(); break;
    case 'bfilter': S.browseFilters[v]=!S.browseFilters[v]; render(); break;
    case 'catalogCat': S.catalogCat=v; S.q=''; go('catalog'); break;
    case 'catalogCatSet': S.catalogCat=v; render(); break;
    case 'sort': S.catalogSort=(S.catalogSort+1)%3; document.getElementById('catalogGrid').innerHTML=catalogGridHTML(); break;
    case 'newProduct': S.draft=newDraft(); go('addProduct'); break;
    case 'rmPhoto': S.draft.photos.splice(+v,1); render(); break;
    case 'rmVideo': S.draft.video=null; render(); break;
    case 'draftKind': S.draft.kind=v; render(); break;
    case 'draftInst': S.draft.inst=!S.draft.inst; render(); break;
    case 'publish': publishDraft(); break;
    case 'delProduct': { const p=prodById(v); if(!p) break; if(confirmInline(el)){ await DB.del(v); delete S.saved[v]; hydrateMine(await DB.all()); savePrefs(); render(); toast('تم حذف المنتج'); } break; }
    case 'resetAll': if(confirmInline(el)){ await DB.clear(); try{localStorage.removeItem(LS_KEY);}catch(_){} location.reload(); } break;
  }
});
/* Two-tap confirm without browser dialogs (dialogs are unreliable in WebView) */
function confirmInline(el){
  if(el.dataset.armed==='1') return true;
  el.dataset.armed='1'; const old=el.innerHTML;
  el.innerHTML=`<span style="color:#A12A1B;font-size:13px;font-weight:700;white-space:nowrap">اضغط مرة أخرى للتأكيد</span>`;
  setTimeout(()=>{ if(el.isConnected){ el.dataset.armed=''; el.innerHTML=old; } },2500);
  return false;
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseAll(); });

/* ============ Boot ============ */
(async()=>{
  history.replaceState({d:1},'');
  await DB.open();
  hydrateMine(await DB.all());
  render(true);
})();
</script>
</body>
