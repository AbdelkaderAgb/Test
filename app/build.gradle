plugins {
    id 'com.android.application'
}

android {
    namespace 'com.demo.furniturereels'
    compileSdk 34

    defaultConfig {
        applicationId 'com.demo.furniturereels'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-demo'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Demo only: sign release with the debug key so the APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies: plain Android framework (Activity + WebView).
