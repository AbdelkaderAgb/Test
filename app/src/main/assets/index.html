<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141110">
<title>تطبيق ريلز المفروشات — نموذج تجريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C1916; --muted:#6B635A; --ground:#FAF7F2; --card:#FFFFFF; --line:#E7E0D6;
  --chip:#F0E8DC; --accent:#A35A12; --price:#8A4E10; --wa:#0F7A43; --dark:#141110;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a2522}
body{font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;background:var(--ground)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:84px;-webkit-overflow-scrolling:touch}
.screen.noNav{padding-bottom:0}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:8px}
.h1{margin:0;font-size:24px;font-weight:700}
.h2{margin:0;font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:44px;display:flex;align-items:center}
.chip span{display:flex;align-items:center;gap:4px;height:34px;padding:0 14px;border-radius:17px;background:#fff;border:1px solid #DDD5CA;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on span{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.chip.accent.on span{background:var(--accent);border-color:var(--accent)}
.chip.dark span{background:rgba(0,0,0,.38);border-color:rgba(255,255,255,.3);color:#fff}
.chip.dark.on span{background:#fff;color:var(--dark);border-color:#fff}
.iconBtn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconBtn.light{background:rgba(255,255,255,.92)}
.iconBtn.outline{background:#fff;border:1px solid var(--line)}
.btn{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}
.btn.wa{background:var(--wa);color:#fff}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid #D9D0C3;font-weight:600}
.card{background:var(--card);border:1px solid #EEE7DC;border-radius:16px}
.badge{height:20px;padding:0 6px;border-radius:6px;background:#E4F1E8;color:#0B5E33;font-weight:700;font-size:11px;display:inline-flex;align-items:center}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabbar{position:absolute;left:0;right:0;bottom:0;height:72px;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:#fff;border-top:1px solid var(--line);z-index:20}
nav.tabbar.dark{background:#0E0C0B;border-top-color:#0E0C0B}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabbar.dark button{color:#A8A29A}
nav.tabbar button.on{color:var(--ink);font-weight:700}
nav.tabbar.dark button.on{color:#fff}
/* reels */
.reels{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;background:var(--dark);scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#fff}
.reel .art{position:absolute;inset:0;width:100%;height:100%}
.reel .scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 20%,rgba(0,0,0,0) 52%,rgba(0,0,0,.88) 100%)}
.reel .kb{animation:kb 14s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.09) translateY(-8px)}}
.reelTop{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;z-index:5;color:#fff}
.side{position:absolute;left:8px;bottom:196px;width:64px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:4}
.side button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:#fff;min-height:44px}
.caption{position:absolute;right:16px;left:82px;bottom:170px;z-index:4;display:flex;flex-direction:column;gap:8px}
.productBar{position:absolute;right:12px;left:12px;bottom:86px;z-index:4;display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;background:rgba(20,17,16,.8);border:1px solid rgba(255,255,255,.16)}
.progress{position:absolute;left:0;right:0;bottom:72px;height:3px;background:rgba(255,255,255,.22);z-index:4}
.progress i{position:absolute;top:0;right:0;height:3px;background:#fff;width:0}
.reel.playing .progress i{animation:prog 15s linear infinite}
@keyframes prog{from{width:0}to{width:100%}}
.heartPop{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;z-index:6}
.heartPop.go{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
/* sheet */
.overlay{position:absolute;inset:0;background:rgba(10,8,7,.55);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out;max-height:92%;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;white-space:nowrap;animation:fade .2s}
.bubble{background:#E3F6DE;border-radius:14px 14px 4px 14px;padding:12px 14px;font-size:14px;line-height:1.7;white-space:pre-line}
input.field{height:48px;border-radius:12px;border:1px solid #D9D0C3;padding:0 14px;font-size:15px;background:#fff;width:100%}
input.field:focus{outline:2px solid var(--accent);outline-offset:0}
.demoTag{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:70;font-size:10px;font-weight:600;background:rgba(163,90,18,.95);color:#fff;padding:2px 8px;border-radius:8px;pointer-events:none;letter-spacing:.2px}
</style>
</head>

/* ============ Navigation ============ */
function go(name, params={}){
  S.stack.push({name, ...params});
  history.pushState({d:S.stack.length}, '');
  S.cityMenu=false;
  render(true);
}
function tab(name){
  S.stack=[{name}];
  history.replaceState({d:1}, '');
  S.cityMenu=false;
  render(true);
}
function back(){
  if(S.sheet){ S.sheet=null; render(); return; }
  if(S.stack.length>1){ S.stack.pop(); render(true); }
}
window.addEventListener('popstate', ()=>{
  if(S.sheet){ S.sheet=null; render(); return; }
  if(S.stack.length>1){ S.stack.pop(); render(true); }
});

let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $app.appendChild(t);
  toastTimer=setTimeout(()=>t.remove(),1800);
}

function tabbar(active, dark=false){
  const items=[['reels','الرئيسية','home'],['browse','تصفّح','browse'],['stores','المتاجر','stores'],['saved','المحفوظات','saved'],['me','حسابي','me']];
  return `<nav class="tabbar ${dark?'dark':''}" aria-label="التنقل الرئيسي">${items.map(([n,l,ic])=>`<button data-act="tab" data-v="${n}" class="${n===active?'on':''}" ${n===active?'aria-current="page"':''}>${NAV_ICONS[ic]}<span>${l}</span></button>`).join('')}</nav>`;
}

/* ============ Render ============ */
let reelObserver;
function render(resetScroll){
  const c=cur();
  const prevScroll = !resetScroll && document.querySelector('.screen') ? document.querySelector('.screen').scrollTop : 0;
  const prevReel = !resetScroll && document.getElementById('reels') ? document.getElementById('reels').scrollTop : 0;
  let html='';
  switch(c.name){
    case 'reels': html=reelsScreen(); break;
    case 'product': html=productScreen(c.id); break;
    case 'shop': html=shopScreen(c.id); break;
    case 'browse': html=browseScreen(); break;
    case 'stores': html=storesScreen(); break;
    case 'catalog': html=catalogScreen(); break;
    case 'saved': html=savedScreen(); break;
    case 'me': html=meScreen(); break;
    case 'watch': html=watchScreen(c.id); break;
  }
  if(S.sheet) html+=orderSheet(S.sheet);
  $app.innerHTML=html;
  const sc=document.querySelector('.screen'); if(sc) sc.scrollTop=prevScroll;
  const rl=document.getElementById('reels');
  if(rl){
    rl.scrollTop = c.startAt!=null && resetScroll ? c.startAt*rl.clientHeight : prevReel;
    setupReels(rl);
  }
  const d=document.getElementById('district');
  if(d) d.addEventListener('input',e=>{S.district=e.target.value; updateBubble();});
  const q=document.getElementById('q');
  if(q){ q.addEventListener('input',e=>{S.q=e.target.value; clearTimeout(q._t); q._t=setTimeout(()=>{const pos=q.selectionStart; render(); const nq=document.getElementById('q'); nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(_){} },250);}); }
}
function updateBubble(){
  const id=S.sheet, p=prodById(id), ci=S.color[id]||0, total=fmt(p.price*S.qty);
  let msg=`السلام عليكم، رأيت هذا المنتج على التطبيق وأريد طلبه:\n${p.name}\nاللون: ${p.colors[ci][0]} — الكمية: ${S.qty}\nالسعر المعروض: ${total} أوقية`;
  if(S.district.trim()) msg+=`\nالحي: ${S.district.trim()}`;
  msg+='\n[رابط المنتج]';
  document.getElementById('bubble').textContent=msg;
}
function watchScreen(id){
  // single-product reel opened from product/shop; reuse feed but start at that product
  return reelsScreen();
}
function setupReels(rl){
  if(reelObserver) reelObserver.disconnect();
  reelObserver=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('playing',e.isIntersecting && e.intersectionRatio>.6)),{root:rl,threshold:[.6]});
  rl.querySelectorAll('.reel').forEach(r=>{
    reelObserver.observe(r);
    let last=0;
    r.addEventListener('click',e=>{
      if(e.target.closest('button')) return;
      const now=Date.now();
      if(now-last<300){ const id=r.dataset.reel; if(!S.liked[id]){S.liked[id]=true; updateLike(r,id);} const h=r.querySelector('.heartPop'); h.classList.remove('go'); void h.offsetWidth; h.classList.add('go'); }
      last=now;
    });
  });
}
function updateLike(r,id){
  const b=r.querySelector('[data-act="like"]'); const p=prodById(id);
  b.innerHTML=I.heart(!!S.liked[id])+`<span>${fmt(p.likes+(S.liked[id]?1:0))}</span>`;
  b.setAttribute('aria-pressed',!!S.liked[id]);
}

/* ============ Events ============ */
$app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  if((act==='closeSheet') && e.target.closest('[data-stop]') && !e.target.closest('button[data-act="closeSheet"]')) return;
  switch(act){
    case 'tab': tab(v); break;
    case 'go': go(v); break;
    case 'back': history.back(); break;
    case 'product': go('product',{id:v}); break;
    case 'shop': S.shopTab=0; go('shop',{id:v}); break;
    case 'watch': {
      const list=PRODUCTS.filter(p=>p.reel && inCity(shopById(p.shop).city));
      S.reelCat='all'; S.reelFeed='for';
      let idx=list.findIndex(p=>p.id===v);
      if(idx<0){ S.city='كل المدن'; idx=PRODUCTS.filter(p=>p.reel).findIndex(p=>p.id===v); }
      go('reels',{startAt:Math.max(0,idx)}); break;
    }
    case 'order': S.qty=1; S.sheet=v; history.pushState({sheet:1},''); render(); break;
    case 'closeSheet': history.back(); break;
    case 'qty': S.qty=Math.min(9,Math.max(1,S.qty+(+v))); { const d=S.district; render(); } break;
    case 'sendWA': toast('في التطبيق الحقيقي: يُفتح واتساب برسالة جاهزة'); break;
    case 'waShop': toast('في التطبيق الحقيقي: يُفتح واتساب المتجر'); break;
    case 'call': toast('في التطبيق الحقيقي: يتصل برقم المتجر'); break;
    case 'share': toast('تم نسخ رابط المنتج'); break;
    case 'soon': toast('هذه الشاشة خارج نطاق النموذج'); break;
    case 'like': { S.liked[v]=!S.liked[v]; const r=el.closest('.reel'); if(r) updateLike(r,v); else render(); break; }
    case 'save': S.saved[v]=!S.saved[v]; toast(S.saved[v]?'تم الحفظ في المحفوظات':'أُزيل من المحفوظات'); render(); break;
    case 'follow': S.followed[v]=!S.followed[v]; toast(S.followed[v]?'تتابع هذا المتجر الآن':'ألغيت المتابعة'); render(); break;
    case 'feed': S.reelFeed=v; render(true); break;
    case 'reelCat': S.reelCat=v; render(true); break;
    case 'color': { const [id,i]=v.split('|'); S.color[id]=+i; render(); break; }
    case 'shopTab': S.shopTab=+v; render(); break;
    case 'cityMenu': S.cityMenu=!S.cityMenu; render(); break;
    case 'closeMenu': S.cityMenu=false; render(); break;
    case 'setCity': S.city=v; S.cityMenu=false; render(cur().name==='reels'); break;
    case 'storesInst': S.storesInst=!S.storesInst; render(); break;
    case 'bfilter': S.browseFilters[v]=!S.browseFilters[v]; render(); break;
    case 'catalogCat': S.catalogCat=v; S.q=''; go('catalog'); break;
    case 'catalogCatSet': S.catalogCat=v; render(); break;
    case 'sort': S.catalogSort=(S.catalogSort+1)%3; render(); break;
  }
});

history.replaceState({d:1},'');
render(true);
(()=>{const t=document.createElement('div');t.className='demoTag';t.textContent='نموذج تجريبي — للتجربة فقط';document.body.appendChild(t);setTimeout(()=>{t.style.transition='opacity .6s';t.style.opacity='0';setTimeout(()=>t.remove(),700);},3500);})();
</script>
</body>
